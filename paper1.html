<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BAJEE JRF AI — Paper I</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-navy">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">🎓 BAJEE JRF AI</a>
    <span class="navbar-text text-gold">Paper I — Teaching & Research Aptitude</span>
  </div>
</nav>

<main class="container py-5">
  <section class="hero p-4 p-md-5 mb-4">
    <div>
      <p class="eyebrow">PAPER I</p>
      <h1>General Paper on Teaching & Research Aptitude</h1>
      <p class="lead mb-0">10-unit knowledge foundation for UGC NET preparation.</p>
    </div>
  </section>

  <div id="syllabusGrid" class="row g-4"></div>
</main>

<script>
fetch("../data/paper1/syllabus.json")
  .then(r => r.json())
  .then(data => {
    document.getElementById("syllabusGrid").innerHTML = data.units.map(u => `
      <div class="col-12 col-lg-6">
        <article class="module-card p-4">
          <div class="d-flex justify-content-between gap-3">
            <div>
              <p class="eyebrow mb-1">UNIT ${u.unit}</p>
              <h2 class="h5">${u.title}</h2>
            </div>
            <span class="badge rounded-pill badge-gold">Paper I</span>
          </div>
          <ul class="mt-3 mb-0">
            ${u.topics.map(t => `<li class="mb-2">${t}</li>`).join("")}
          </ul>
        </article>
      </div>
    `).join("");
  })
  .catch(() => {
    document.getElementById("syllabusGrid").innerHTML =
      '<div class="col-12"><div class="alert alert-warning">Unable to load the Paper I syllabus file.</div></div>';
  });
</script>
</body>
</html>
