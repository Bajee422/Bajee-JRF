<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAJEE JRF AI — Syllabus</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-navy"><div class="container">
<a class="navbar-brand fw-bold" href="index.html">🎓 BAJEE JRF AI</a>
<span class="navbar-text text-gold">UGC NET • Syllabus</span>
</div></nav>

<main class="container py-5">
<section class="hero p-4 p-md-5 mb-4">
<div><p class="eyebrow">KNOWLEDGE FOUNDATION</p>
<h1>UGC NET Paper I + Paper II</h1>
<p class="lead mb-0">The syllabus is the master taxonomy for PYQs, study materials, videos, audio, notes, bookmarks and the AI agents.</p></div>
</section>

<ul class="nav nav-pills mb-4" id="syllabusTabs">
<li class="nav-item"><button class="nav-link active" data-paper="paper1">📘 Paper I</button></li>
<li class="nav-item ms-2"><button class="nav-link" data-paper="paper2">📕 Paper II — English</button></li>
</ul>
<div id="syllabusGrid" class="row g-4"></div>
</main>

<script>
const files={paper1:"data/paper1/syllabus.json",paper2:"data/paper2/syllabus.json"};
let active="paper1";
async function loadSyllabus(){
 const data=await fetch(files[active]).then(r=>r.json());
 document.getElementById("syllabusGrid").innerHTML=data.units.map(u=>`
 <div class="col-12 col-lg-6">
  <article class="module-card p-4">
   <div class="d-flex justify-content-between gap-3">
    <div><p class="eyebrow mb-1">UNIT ${u.unit}</p><h2 class="h5">${u.title}</h2></div>
    <span class="badge rounded-pill badge-gold">${data.paper}</span>
   </div>
   ${u.topics.length ? `<ul class="mt-3 mb-0">${u.topics.map(t=>`<li class="mb-2">${t}</li>`).join("")}</ul>` : `<p class="text-secondary mt-3 mb-0">Sub-topics will be populated in the next knowledge-base stage.</p>`}
  </article>
 </div>`).join("");
}
document.querySelectorAll("#syllabusTabs button").forEach(btn=>{
 btn.addEventListener("click",()=>{document.querySelectorAll("#syllabusTabs .nav-link").forEach(x=>x.classList.remove("active"));btn.classList.add("active");active=btn.dataset.paper;loadSyllabus();});
});
loadSyllabus();
</script>
</body></html>
