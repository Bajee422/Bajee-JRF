<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BAJEE JRF AI — Exam History & Review</title>
<style>
:root{--navy:#071a3d;--gold:#d4af37;--bg:#f4f7fb;--ink:#172033;--muted:#64748b;--line:#dbe3ef;--green:#15803d;--red:#b91c1c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1150px;margin:0 auto;padding:24px 16px 60px}.hero{background:linear-gradient(135deg,var(--navy),#17396c);color:white;border-radius:18px;padding:26px;margin-bottom:20px}.hero h1{margin:0 0 8px;font-size:clamp(1.5rem,3vw,2.2rem)}.hero p{margin:0;color:#dbeafe}.toolbar,.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.toolbar input,.toolbar select{padding:10px;border:1px solid #cbd5e1;border-radius:8px;background:white;color:var(--ink)}button,.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:8px;padding:10px 13px;background:var(--gold);color:#111827;font-weight:700;text-decoration:none;cursor:pointer}.btn.secondary,button.secondary{background:#e8eef8;color:var(--navy);border:1px solid #cbd5e1}.btn.danger{background:#fee2e2;color:#991b1b}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}.stat{background:white;border:1px solid var(--line);border-radius:12px;padding:14px}.stat small{display:block;color:var(--muted)}.stat strong{font-size:1.4rem}.muted{color:var(--muted)}.record-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.record-head h2{font-size:1.1rem;margin:0 0 5px}.pill{display:inline-block;border-radius:999px;padding:4px 9px;background:#e8eef8;color:var(--navy);font-size:.82rem;font-weight:700}.record-metrics{display:flex;flex-wrap:wrap;gap:14px;margin:12px 0;color:#334155}.record-actions{display:flex;gap:8px;flex-wrap:wrap}.review{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}.review-item{padding:12px;border:1px solid var(--line);border-radius:10px;margin:10px 0;background:#fbfdff}.review-item h3{font-size:1rem;margin:0 0 8px}.option{padding:5px 8px;border-radius:6px;margin:3px 0}.option.correct{background:#dcfce7;color:#166534}.option.chosen-wrong{background:#fee2e2;color:#991b1b}.notice{padding:14px;background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;color:#9a3412}.empty{padding:28px;text-align:center;background:white;border:1px dashed #cbd5e1;border-radius:14px}.hidden{display:none!important}footer{text-align:center;color:var(--muted);margin-top:28px;font-size:.9rem}
</style></head><body><main class="wrap">
<header class="hero"><h1>📚 Exam History &amp; Review</h1><p>Review completed NTA exams, track attempts, and start another attempt without deleting previous results.</p></header>
<section class="stats" id="stats"></section>
<section class="toolbar"><input id="search" type="search" placeholder="Search exam or session ID" aria-label="Search exams"><select id="paperFilter" aria-label="Filter by paper"><option value="all">All papers</option><option value="Paper I">Paper I</option><option value="Paper II">Paper II — English</option><option value="Full Mock">Full Mock</option></select><select id="sort" aria-label="Sort history"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="score-high">Highest score</option><option value="score-low">Lowest score</option></select><a class="btn secondary" href="nta-exam.html">← Back to NTA Exam</a><button class="secondary" id="refresh">Refresh</button></section>
<div id="notice" class="notice hidden"></div><section id="records"></section><footer>BAJEE JRF AI • Exam history is stored in this browser's local storage. Export or back up browser data if you need a permanent copy.</footer></main>
<script>
(function(){
'use strict';
const KEY='bajee_jrf_ai_test_history_v1';
const recordsEl=document.getElementById('records'),statsEl=document.getElementById('stats'),searchEl=document.getElementById('search'),paperEl=document.getElementById('paperFilter'),sortEl=document.getElementById('sort'),noticeEl=document.getElementById('notice');
let historyRows=[];const expanded=new Set();
function safe(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function dateValue(r){const d=new Date(r.date||r.submittedAt||r.timestamp||0);return Number.isNaN(d.getTime())?0:d.getTime();}
function paperName(r){const s=String(r.paper_label||r.paper||'Unknown paper');if(s==='paper1')return 'Paper I';if(s==='paper2')return 'Paper II — English';if(s==='full')return 'Full Mock';if(/paper\s*i{1,2}/i.test(s))return s;return s;}
function pct(r){const n=Number(r.score);if(Number.isFinite(n))return n;const total=Number(r.total||0);return total?Number(r.correct||0)/total*100:0;}
function load(){try{const raw=localStorage.getItem(KEY);historyRows=raw?JSON.parse(raw):[];if(!Array.isArray(historyRows))throw new Error('History data is not a list.');noticeEl.classList.add('hidden');}catch(e){historyRows=[];noticeEl.textContent='The saved exam history could not be read. Your data has not been deleted. Check this browser’s local storage before clearing anything.';noticeEl.classList.remove('hidden');}render();}
function render(){const total=historyRows.length,attempted=historyRows.reduce((s,r)=>s+Number(r.total||0),0),avg=total?historyRows.reduce((s,r)=>s+pct(r),0)/total:0;statsEl.innerHTML=`<div class="stat"><small>Completed attempts</small><strong>${total}</strong></div><div class="stat"><small>Questions across attempts</small><strong>${attempted}</strong></div><div class="stat"><small>Average accuracy</small><strong>${avg.toFixed(1)}%</strong></div><div class="stat"><small>Most recent exam</small><strong>${total?safe(new Date(dateValue([...historyRows].sort((a,b)=>dateValue(b)-dateValue(a))[0])).toLocaleDateString()):'—'}</strong></div>`;
let rows=historyRows.map((r,i)=>({...r,_idx:i}));const q=searchEl.value.trim().toLowerCase(),paper=paperEl.value;if(q)rows=rows.filter(r=>(String(r.session_id||'')+' '+paperName(r)).toLowerCase().includes(q));if(paper!=='all')rows=rows.filter(r=>{const p=paperName(r);return paper==='Paper I'?/^Paper I$/i.test(p):paper==='Paper II'?/Paper II/i.test(p):/Full Mock/i.test(p)});if(sortEl.value==='oldest')rows.sort((a,b)=>dateValue(a)-dateValue(b));else if(sortEl.value==='score-high')rows.sort((a,b)=>pct(b)-pct(a));else if(sortEl.value==='score-low')rows.sort((a,b)=>pct(a)-pct(b));else rows.sort((a,b)=>dateValue(b)-dateValue(a));
if(!rows.length){recordsEl.innerHTML=`<div class="empty"><h2>No exam history found</h2><p class="muted">Completed NTA exams will appear here after you submit them. Your existing history is not modified by this page.</p><a class="btn" href="nta-exam.html">Start an examination</a></div>`;return;}
const attemptsByPaper={};historyRows.forEach(r=>{const p=paperName(r);attemptsByPaper[p]=(attemptsByPaper[p]||0)+1;});
recordsEl.innerHTML=rows.map(r=>{const id=String(r.session_id||('legacy-'+r._idx)),expandedNow=expanded.has(id),date=dateValue(r)?new Date(dateValue(r)).toLocaleString():'Date not recorded',p=paperName(r),attemptNo=historyRows.filter(x=>paperName(x)===p&&dateValue(x)<=dateValue(r)).length,correct=Number(r.correct||0),wrong=Number(r.wrong||0),unanswered=Number(r.unanswered||0),questions=Array.isArray(r.question_results)?r.question_results:[];return `<article class="card"><div class="record-head"><div><h2>${safe(p)}</h2><div class="muted">${safe(date)}</div><div class="muted">Session: ${safe(r.session_id||'Not recorded')}</div></div><div><span class="pill">Attempt ${attemptNo} of ${attemptsByPaper[p]||1}</span> <span class="pill">${pct(r).toFixed(1)}% accuracy</span></div></div><div class="record-metrics"><span><b>${Number(r.total||questions.length||0)}</b> questions</span><span><b>${correct}</b> correct</span><span><b>${wrong}</b> wrong</span><span><b>${unanswered}</b> unanswered</span></div><div class="record-actions"><button data-review="${safe(id)}">${expandedNow?'Hide review':'Review answers'}</button><a class="btn secondary" href="nta-exam.html?restartPaper=${encodeURIComponent(p==='Paper I'?'paper1':/Paper II/i.test(p)?'paper2':'full')}">↻ Restart exam</a></div>${expandedNow?`<div class="review">${questions.length?questions.map((q,i)=>renderQuestion(q,i)).join(''):'<p class="notice">This older record contains score metadata but no saved question snapshots, so detailed question review is unavailable for this attempt.</p>'}</div>`:''}</article>`;}).join('');
recordsEl.querySelectorAll('[data-review]').forEach(b=>b.addEventListener('click',()=>{const id=b.getAttribute('data-review');if(expanded.has(id))expanded.delete(id);else expanded.add(id);render();}));}
function renderQuestion(q,i){const question=q.question_text||q.question||'Question text was not saved for this attempt.';const options=q.options&&typeof q.options==='object'?q.options:{};const chosen=String(q.selected_answer||'').toUpperCase(),correct=String(q.correct_answer||'').toUpperCase();const optionHtml=Object.entries(options).map(([k,v])=>{const isCorrect=k.toUpperCase()===correct,isChosen=k.toUpperCase()===chosen;return `<div class="option ${isCorrect?'correct':''} ${isChosen&&!isCorrect?'chosen-wrong':''}"><b>${safe(k)}.</b> ${safe(v)} ${isCorrect?' ✓ Correct answer':''} ${isChosen?' • Your answer':''}</div>`;}).join('');const correctLabel=correct?(options[correct]?correct+'. '+options[correct]:correct):'No verified answer saved';return `<div class="review-item"><h3>Q${i+1}. ${safe(question)}</h3>${optionHtml}<p><b>Your answer:</b> ${safe(chosen?(options[chosen]?chosen+'. '+options[chosen]:chosen):'Unanswered')}</p><p><b>Correct answer:</b> ${safe(correctLabel)}</p>${q.explanation?`<p><b>Source explanation:</b> ${safe(q.explanation)}</p>`:''}<p class="muted">${safe(q.year||'Year not recorded')} ${q.session?'• '+safe(q.session):''} ${q.unit?'• '+safe(q.unit):''} ${q.topic?'• '+safe(q.topic):''}</p></div>`;}
searchEl.addEventListener('input',render);paperEl.addEventListener('change',render);sortEl.addEventListener('change',render);document.getElementById('refresh').addEventListener('click',load);load();
})();
</script></body></html>
